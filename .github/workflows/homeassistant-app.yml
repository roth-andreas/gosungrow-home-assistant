name: homeassistant-app

on:
  push:
    branches:
      - main
      - master
      - "test-*"
    tags:
      - "v*"
    paths:
      - ".github/workflows/homeassistant-app.yml"
      - ".dockerignore"
      - "AGENTS.md"
      - ".agents/skills/**"
      - "docs/**"
      - "specs/**"
      - "scripts/**"
      - "tools/preview/gosungrow-source-mapping-card.test.cjs"
      - "tools/test_energy_summary_card.mjs"
      - "tools/ha-e2e/**"
      - "addon/gosungrow/**"
      - "cmd/**"
      - "cmdHassio/**"
      - "defaults/**"
      - "iSolarCloud/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
  pull_request:
    paths:
      - ".github/workflows/homeassistant-app.yml"
      - ".dockerignore"
      - "AGENTS.md"
      - ".agents/skills/**"
      - "docs/**"
      - "specs/**"
      - "scripts/**"
      - "tools/preview/gosungrow-source-mapping-card.test.cjs"
      - "tools/test_energy_summary_card.mjs"
      - "tools/ha-e2e/**"
      - "addon/gosungrow/**"
      - "cmd/**"
      - "cmdHassio/**"
      - "defaults/**"
      - "iSolarCloud/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate normative specifications
        run: python scripts/check_specs.py

      - name: Validate specification and implementation PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          args=(--base "${{ github.event.pull_request.base.sha }}")
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'spec-docs-only') }}" == "true" ]]; then
            args+=(--allow-spec-only)
          fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'behavior-neutral') }}" == "true" ]]; then
            args+=(--allow-implementation-only)
          fi
          python scripts/check_spec_change_scope.py "${args[@]}"

      - name: Validate version alignment
        shell: bash
        run: |
          app_package_version="$(awk '/^version:/{print $2}' addon/gosungrow/config.yaml)"
          app_version="$(awk -F'\"' '/BinaryVersion = /{print $2}' defaults/const.go)"
          case "$app_package_version" in
            "$app_version"*) ;;
            *)
              echo "App version $app_package_version must start with binary version $app_version"
              exit 1
              ;;
          esac

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
        run: |
          go mod download
          go build .

      - name: Run Go tests
        env:
          CGO_ENABLED: 0
        run: go test ./...

      - name: Run dashboard card tests
        run: |
          node tools/preview/gosungrow-source-mapping-card.test.cjs
          node tools/test_energy_summary_card.mjs

      - name: Install browser smoke dependencies
        run: |
          npm ci --prefix tools/ha-e2e
          tools/ha-e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run dashboard smoke against pinned Home Assistant Core
        shell: bash
        env:
          HA_CORE_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.3
        run: |
          fixture="$RUNNER_TEMP/gosungrow-ha-e2e"
          mkdir -p "$fixture/www/gosungrow"
          cp tools/ha-e2e/configuration.yaml "$fixture/configuration.yaml"
          asset="addon/gosungrow/assets/gosungrow-energy-flow-card-v2.js"
          asset_hash="$(sha256sum "$asset" | awk '{print $1}')"
          asset_name="gosungrow-dashboard-cards.${asset_hash:0:12}.js"
          cp "$asset" "$fixture/www/gosungrow/$asset_name"
          docker run -d --name gosungrow-ha-e2e \
            -p 8123:8123 \
            -v "$fixture:/config" \
            "$HA_CORE_IMAGE"
          cleanup() {
            status=$?
            set +e
            docker logs gosungrow-ha-e2e || true
            docker rm -f gosungrow-ha-e2e >/dev/null 2>&1 || true
            docker run --rm --entrypoint /bin/sh \
              -v "$fixture:/cleanup" \
              "$HA_CORE_IMAGE" \
              -c 'rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?*' \
              >/dev/null 2>&1 || true
            rm -rf "$fixture" || true
            return "$status"
          }
          trap cleanup EXIT
          HA_E2E_URL=http://127.0.0.1:8123 \
          HA_E2E_RESOURCE_URL="/local/gosungrow/$asset_name" \
          HA_E2E_RESOURCE_HASH="$asset_hash" \
            node tools/ha-e2e/dashboard_resource_smoke.mjs

      - name: Validate first-install local-route bootstrap recovery
        shell: bash
        env:
          HA_CORE_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.3
        run: bash tools/ha-e2e/local_route_bootstrap.sh

      - name: Validate app startup script
        shell: bash
        run: |
          bash -n addon/gosungrow/run.sh addon/gosungrow/recovery_policy.sh addon/gosungrow/recovery_policy_test.sh
          bash addon/gosungrow/recovery_policy_test.sh

      - name: Build app image (amd64 smoke test)
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=test \
            -f addon/gosungrow/Dockerfile \
            .

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        shell: bash
        run: echo "value=$(awk '/^version:/{print $2}' addon/gosungrow/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build image tags
        id: image_tags
        shell: bash
        run: |
          {
            echo "value<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/gosungrow-addon-${{ matrix.arch }}:${{ steps.version.outputs.value }}"
            if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
              echo "ghcr.io/${{ github.repository_owner }}/gosungrow-addon-${{ matrix.arch }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/gosungrow/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.image_tags.outputs.value }}
